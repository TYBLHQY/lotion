name: Build and publish Notion Linux package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/check-upstream.cjs'
      - 'scripts/publish-release.cjs'
      - 'tests/check-upstream.test.cjs'
      - 'tests/publish-release.test.cjs'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Schedule, manual checks and tag builds must not race to publish one version.
concurrency:
  group: notion-linux-release
  cancel-in-progress: false

jobs:
  build-and-release:
    # Repair branches use the pull-request verifier, never the publisher.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'

      - name: Test update detection and release retries
        run: node --test tests/check-upstream.test.cjs tests/publish-release.test.cjs

      - name: Install version probe dependencies
        if: github.ref_type != 'tag'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl p7zip-full

      - name: Check upstream version
        id: upstream
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$RUNNER_TEMP/notion-upstream"
          installer="$GITHUB_WORKSPACE/build/inputs/notion-windows-installer.exe"
          mkdir -p "$probe_dir/installer" "$probe_dir/payload" "$(dirname "$installer")"

          # Keep API failures separate from an actually empty release history.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$probe_dir/releases.json"

          curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            'https://www.notion.so/desktop/windows/download' \
            --output "$installer"
          7z x -y "$installer" '$PLUGINSDIR/app-64.7z' \
            "-o$probe_dir/installer" >/dev/null
          payload_archive="$(find "$probe_dir/installer" -type f -name 'app-64.7z' -print -quit)"
          if [[ -z "$payload_archive" ]]; then
            echo 'Could not find the Notion application archive in the installer.' >&2
            exit 1
          fi
          7z x -y "$payload_archive" 'resources/app.asar' \
            "-o$probe_dir/payload" >/dev/null
          asar_file="$probe_dir/payload/resources/app.asar"
          if [[ ! -f "$asar_file" ]]; then
            echo 'Could not find resources/app.asar in the installer.' >&2
            exit 1
          fi
          (
            cd "$probe_dir"
            npx --yes @electron/asar@4.3.1 extract-file "$asar_file" package.json
          )
          node scripts/check-upstream.cjs "$probe_dir/package.json" "$probe_dir/releases.json" \
            | tee -a "$GITHUB_OUTPUT"
          echo "installer_sha256=$(sha256sum "$installer" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Summarize upstream check
        if: github.ref_type != 'tag'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
          LATEST_RELEASED: ${{ steps.upstream.outputs.latest_released_version }}
          CHECK_REASON: ${{ steps.upstream.outputs.reason }}
          INSTALLER_SHA256: ${{ steps.upstream.outputs.installer_sha256 }}
        run: |
          {
            printf '## Notion EXE update check\n\n'
            printf 'Official EXE version: %s. Latest complete release: %s.\n\n' \
              "$UPSTREAM_VERSION" "${LATEST_RELEASED:-none}"
            printf '%s\n\n' "$CHECK_REASON"
            printf 'Installer SHA-256: `%s`\n' "$INSTALLER_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select tag for pushed release
        id: tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*(\+local4)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          version="${tag#v}"
          echo "upstream_version=${version%+local4}" >> "$GITHUB_OUTPUT"
          echo 'should_build=true' >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        if: steps.upstream.outputs.should_build == 'true' || steps.tag.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file p7zip-full python3 dpkg-dev \
            xvfb xauth xdotool imagemagick libgtk-3-0 libnss3 libasound2 libgbm1

      - name: Build Debian package
        if: steps.upstream.outputs.should_build == 'true' || steps.tag.outputs.should_build == 'true'
        env:
          NOTION_EXPECTED_VERSION: ${{ steps.upstream.outputs.upstream_version || steps.tag.outputs.upstream_version }}
        run: ./build.sh

      - name: Verify Alt menu and SQLite in assembled app
        if: steps.upstream.outputs.should_build == 'true' || steps.tag.outputs.should_build == 'true'
        run: |
          mkdir -p build/analysis
          xvfb-run -a node scripts/verify-alt-menu.cjs build/deb-staging/opt/Notion/notion fixed

      - name: Upload verification evidence
        if: always() && (steps.upstream.outputs.should_build == 'true' || steps.tag.outputs.should_build == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: local4-verification
          path: |
            build/analysis/runtime-fixed.*
            build/analysis/alt-fixed.png
            build/analysis/manual-menu-fixed.png
            build/patch-report.json
            build/deb-staging/usr/share/doc/notion/build-manifest.json

      - name: Check package version and create checksum
        id: package
        if: steps.upstream.outputs.should_build == 'true' || steps.tag.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one Debian package, found ${#packages[@]}." >&2
            exit 1
          fi

          package="${packages[0]}"
          version="$(dpkg-deb --field "$package" Version)"
          upstream_version="${version%+local4}"
          expected_version="${{ steps.upstream.outputs.upstream_version || steps.tag.outputs.upstream_version }}"
          if [[ "$upstream_version" != "$expected_version" ]]; then
            echo "Expected Notion $expected_version but built package version is $version." >&2
            exit 1
          fi

          (
            cd "$(dirname "$package")"
            sha256sum "$(basename "$package")" > "$(basename "$package").sha256"
          )
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.upstream.outputs.should_build == 'true' || steps.tag.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag || steps.tag.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Unofficial Linux repack of Notion ${{ steps.package.outputs.upstream_version }} for personal use.

          This package is built from Notion's official Windows installer and is not affiliated with or endorsed by Notion.

          - Linux: Alt and Alt combinations no longer open the File/Edit/View/History/Window/Help popup. The manual menu remains available.
          - AST-based compatibility patches fail if upstream targets change; build tools are pinned by the lockfile.
          - SQLite is rebuilt for Electron; alternative SQLite prebuilds and the test extension are excluded.
          - The package contains /usr/share/doc/notion/build-manifest.json with source, installer, ASAR, patch, and native-addon hashes.
          - Regression tests and real keyboard/SQLite checks run before publication. Verification evidence is attached to this Actions run.
          EOF

          node scripts/publish-release.cjs "$RELEASE_TAG" "$PACKAGE_VERSION" \
            "$PACKAGE_PATH" release-notes.md
