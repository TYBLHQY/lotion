name: Build and publish Notion for Linux

on:
  push:
    branches: [main, lotion-flatpak-deb]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus-x11 desktop-file-utils flatpak file xvfb xauth

      - name: Prepare Flatpak user environment
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/flatpak-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          echo "XDG_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Resolve a version fallback for the Flatpak payload
        id: version_fallback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          fallback="$(sed -nE 's/^v([0-9]+(\.[0-9]+)*)[^0-9].*/\1/p' <<< "$latest_tag")"
          if [[ -z "$fallback" ]]; then fallback='7.35.1'; fi
          echo "version=$fallback" >> "$GITHUB_OUTPUT"

      - name: Build the Debian package from Notion's official Linux Flatpak
        env:
          NOTION_VERSION_FALLBACK: ${{ steps.version_fallback.outputs.version }}
        run: ./build.sh

      - name: Install and test the Debian package
        id: test
        shell: bash
        run: |
          set -euo pipefail
          package="$(find dist -maxdepth 1 -type f -name 'notion-desktop_*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --field "$package" Package | grep -Fxq notion-desktop
          sudo apt-get install --yes --no-install-recommends "./$package"
          test -x /opt/Notion/notion-launcher
          test -f /usr/share/applications/notion.desktop
          grep -Fq 'x-scheme-handler/notion;' /usr/share/applications/notion.desktop

          smoke_home="$RUNNER_TEMP/notion-smoke"
          mkdir -p "$smoke_home"
          chmod 700 "$smoke_home"
          timeout --signal=TERM 25s xvfb-run --auto-servernum \
            dbus-run-session -- env HOME="$smoke_home" \
            XDG_CONFIG_HOME="$smoke_home/.config" \
            /opt/Notion/notion-launcher --disable-gpu --no-sandbox \
            > "$RUNNER_TEMP/notion-smoke.log" 2>&1 &
          smoke_pid=$!
          started=false
          for _ in $(seq 1 15); do
            if pgrep -u "$(id -u)" -f '/opt/Notion/app/' >/dev/null; then
              started=true
              break
            fi
            if ! kill -0 "$smoke_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$started" != true ]]; then
            set +e
            wait "$smoke_pid"
            status=$?
            set -e
            cat "$RUNNER_TEMP/notion-smoke.log"
            echo "Notion did not open within 15 seconds (status $status)." >&2
            exit 1
          fi
          kill "$smoke_pid" 2>/dev/null || true
          wait "$smoke_pid" 2>/dev/null || true
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Check whether this Flatpak commit is already released
        id: release_check
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import json; print(json.load(open("dist/build-metadata.json"))["commit"])')"
          source_commit="$(python3 -c 'import json; print(json.load(open("dist/build-metadata.json"))["source_commit"])')"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          if python3 - "$RUNNER_TEMP/releases.json" "$commit" "$source_commit" <<'PY'
          import json
          import sys
          releases = json.load(open(sys.argv[1], encoding="utf-8"))
          app_commit, source_commit = sys.argv[2:]
          found = any(
              f"Notion Flatpak commit: {app_commit}" in (release.get("body") or "")
              and f"Lotion packaging commit: {source_commit}" in (release.get("body") or "")
              for release in releases
          )
          raise SystemExit(0 if found else 1)
          PY
          then
            echo "This app and packaging commit pair is already released; skipping publication."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create checksum
        if: steps.release_check.outputs.publish == 'true'
        run: sha256sum "dist/${{ steps.test.outputs.package }}" > "dist/${{ steps.test.outputs.package }}.sha256"

      - name: Publish GitHub release
        if: steps.release_check.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=dist/build-metadata.json
          version="$(python3 -c 'import json; print(json.load(open("dist/build-metadata.json"))["version"])')"
          commit="$(python3 -c 'import json; print(json.load(open("dist/build-metadata.json"))["commit"])')"
          source_commit="$(python3 -c 'import json; print(json.load(open("dist/build-metadata.json"))["source_commit"])')"
          tag="$(python3 -c 'import json; print(json.load(open("dist/build-metadata.json"))["tag"])')"
          package="dist/$(python3 -c 'import json; print(json.load(open("dist/build-metadata.json"))["package"])')"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Notion $version for Debian-based Linux systems, built from Notion's official Linux Flatpak payload.

          Notion Flatpak commit: $commit
          Lotion packaging commit: $source_commit

          The Debian package includes the app and its runtime libraries, so Flatpak is not required to install or run it. The Notion application remains proprietary and this repack is an independent community packaging project.
          EOF
          gh release create "$tag" "$package" "$package.sha256" \
            --target "$GITHUB_SHA" \
            --title "Notion $version for Linux (DEB)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
