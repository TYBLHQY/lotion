name: Build GTK4 Notion test package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-gtk4-build
  cancel-in-progress: false

jobs:
  build:
    # Chromium's source and object files exceed standard hosted-runner storage.
    # Register a dedicated Linux x64 self-hosted runner with the notion-gtk4 label.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, notion-gtk4]
    timeout-minutes: 360
    env:
      ELECTRON_VERSION: 43.6.0
      NINJA_JOBS: 4
      GCLIENT_JOBS: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build Electron with GTK4
        run: ./scripts/build-electron-gtk4.sh

      - name: Package Notion with the custom Electron runtime
        env:
          NOTION_ELECTRON_DIST: ${{ github.workspace }}/build/inputs
        run: ./build.sh

      - name: Verify package metadata and runtime linkage
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.deb)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one .deb, found ${#packages[@]}." >&2
            exit 1
          fi
          staging="$RUNNER_TEMP/notion-gtk4-package"
          rm -rf "$staging"
          mkdir -p "$staging"
          dpkg-deb -x "${packages[0]}" "$staging"
          app="$staging/opt/Notion/notion"
          test -x "$app"
          if readelf -d "$app" | grep -q 'libgtk-3\.so'; then
            echo 'The packaged Electron binary still links directly to GTK3.' >&2
            exit 1
          fi
          dpkg-deb --field "${packages[0]}" Package Version Architecture
          sha256sum "${packages[0]}" > "${packages[0]}.sha256"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: notion-gtk4-deb
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
          retention-days: 14
